name: fob

x-server: &server
  build:
    context: .
    dockerfile: Dockerfile.server
  image: fob-server:local
  init: true
  environment: &server-environment
    NODE_ENV: production
    ROLE: api,collab,mcp
    FOB_SERVICE_HOST: 0.0.0.0
    FOB_SERVICE_PORT: 8721
    DATABASE_URL: postgresql://fob_app:${FOB_DATABASE_APP_PASSWORD:?Set an independent Fob runtime secret}@postgres:5432/fob
    REDIS_URL: redis://:${KNOWLEDGE_REDIS_PASSWORD:?Set an independent Fob Redis secret}@redis:6379
    BETTER_AUTH_URL: ${FOB_PUBLIC_WEB_ORIGIN:?Set the public HTTPS Web origin}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set an independent Fob auth secret}
    FOB_AUTH_TRUSTED_ORIGINS: ${FOB_PUBLIC_WEB_ORIGIN}
    FOB_AUTH_COOKIE_MODE: same-site
    FOB_AUTH_PROVIDERS: ${FOB_AUTH_PROVIDERS:-}
    S3_ENDPOINT: ${FOB_PUBLIC_S3_ORIGIN:?Set the public S3 HTTPS origin reachable from browsers and containers}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-fob-knowledge}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set an independent Fob storage key}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set an independent Fob storage secret}
    MEDIA_WORKER_URL: http://media-worker:8910
    MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:?Set an independent media worker token}
    KNOWLEDGE_AI_API_KEY: ${KNOWLEDGE_AI_API_KEY:-}
    KNOWLEDGE_AI_CHAT_BASE_URL: ${KNOWLEDGE_AI_CHAT_BASE_URL:-}
    KNOWLEDGE_AI_MODEL: ${KNOWLEDGE_AI_MODEL:-}
    KNOWLEDGE_AI_VISION_MODEL: ${KNOWLEDGE_AI_VISION_MODEL:-}
    KNOWLEDGE_AI_EMBED_MODEL: ${KNOWLEDGE_AI_EMBED_MODEL:-}
    KNOWLEDGE_AI_EMBED_DIMENSIONS: ${KNOWLEDGE_AI_EMBED_DIMENSIONS:-1024}
    KNOWLEDGE_AI_OLLAMA_ENDPOINT: ${KNOWLEDGE_AI_OLLAMA_ENDPOINT:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-noreply@example.com}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_FOB_API_URL: ${FOB_PUBLIC_WEB_ORIGIN}
    image: fob-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:3001:8080"]
    depends_on: [server]

  server:
    <<: *server
    restart: unless-stopped
    # Chromium runs as the unprivileged node user with its sandbox enabled.
    # SYS_ADMIN is required for its Linux namespace sandbox in Docker.
    cap_add: [SYS_ADMIN]
    shm_size: 1gb
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *server
    restart: unless-stopped
    command: ["bun", "backend/server/src/entrypoints/worker.ts"]
    environment:
      <<: *server-environment
      ROLE: worker
    depends_on:
      postgres: { condition: service_healthy }
      media-worker: { condition: service_healthy }

  database-init:
    <<: *server
    profiles: [tools]
    restart: "no"
    command: ["bun", "backend/server/scripts/database.ts", "init"]
    environment:
      <<: *server-environment
      DATABASE_ADMIN_URL: postgresql://fob_admin:${FOB_POSTGRES_PASSWORD:?Set an independent Fob administrator secret}@postgres:5432/fob
    depends_on:
      postgres: { condition: service_healthy }

  queue-init:
    <<: *server
    profiles: [tools]
    restart: "no"
    command: ["bun", "backend/server/scripts/knowledge-jobs.ts", "init"]
    environment:
      <<: *server-environment
      DATABASE_ADMIN_URL: postgresql://fob_admin:${FOB_POSTGRES_PASSWORD}@postgres:5432/fob
    depends_on:
      postgres: { condition: service_healthy }

  storage-init:
    <<: *server
    profiles: [tools]
    restart: "no"
    command: ["node", "scripts/initialize-storage.mjs"]
    depends_on:
      minio: { condition: service_healthy }

  postgres:
    image: paradedb/paradedb:0.25.10-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fob_admin
      POSTGRES_DB: fob
      POSTGRES_PASSWORD: ${FOB_POSTGRES_PASSWORD}
      FOB_DATABASE_APP_PASSWORD: ${FOB_DATABASE_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-bootstrap.sh:/docker-entrypoint-initdb.d/10-fob-role.sh:ro
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${KNOWLEDGE_REDIS_PASSWORD}
    command: [/bin/sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: fob-knowledge-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./backend/server/scripts
      dockerfile: knowledge-infra-minio.Dockerfile
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
    command: [server, /data, --console-address, ':9001']
    # Put an HTTPS reverse proxy for FOB_PUBLIC_S3_ORIGIN in front of this port.
    ports: ["127.0.0.1:59010:9000", "127.0.0.1:59011:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 5s
      retries: 12

  media-worker:
    build: ./services/media-worker
    image: fob-media-worker:local
    restart: unless-stopped
    environment:
      MEDIA_WORKER_HOST: 0.0.0.0
      MEDIA_WORKER_PORT: 8910
      MEDIA_WORKER_DEVICE: ${MEDIA_WORKER_DEVICE:-cpu}
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN}
      MEDIA_WORKER_DOWNLOAD_ORIGINS: ${FOB_PUBLIC_S3_ORIGIN}

volumes:
  postgres-data:
  redis-data:
  minio-data:
